{% extends 'base.html' %}

{% block title %}Editar Utilizador{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-pencil"></i> Editar Utilizador</h2>
    <a href="{{ url_for('configuracao.utilizadores') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <p class="text-muted">{{ utilizador.email }}</p>
                    <div class="form-text">O email não é editável aqui.</div>
                </div>
                <hr>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Nome completo</label>
                        <input type="text"
                               class="form-control"
                               name="nome"
                               value="{{ utilizador.nome }}"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Perfil</label>
                        <select class="form-select" name="perfil" required>
                            <option value="auditor" {% if utilizador.perfil == 'auditor' %}selected{% endif %}>Auditor</option>
                            <option value="administrador" {% if utilizador.perfil == 'administrador' %}selected{% endif %}>Administrador</option>
                        </select>
                    </div>
                    <div class="form-text mb-3">
                        A password é da responsabilidade do próprio utilizador —
                        gerida em "O Meu Perfil", não aqui.
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Guardar
                        </button>
                        <a href="{{ url_for('configuracao.utilizadores') }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
